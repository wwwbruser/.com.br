<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buser | Passagens de Ônibus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  :root { --brand:#f11075; --brand-dark:#e70869; --grey-dark:#454545; --grey-med:#757575; --grey-light:#e0e0e0; --grey-lighter:#fafafa; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:'Poppins',sans-serif;color:var(--grey-dark);background:#fff;overflow-x:hidden}
  a{text-decoration:none;color:inherit} ul{list-style:none;margin:0;padding:0}
  .container{max-width:1200px;margin:0 auto;padding:0 16px;width:100%}

  .taskbar{position:fixed;top:0;left:0;right:0;z-index:35;height:56px;background-color:#fafafa;box-shadow: 0 4px 8px rgba(0,0,0,0.1);display:flex;align-items:center}
  .taskbar-desktop{display:flex;align-items:center;justify-content:space-between;width:100%}
  .logo{width:122px;height:24px; color:var(--brand); fill:var(--brand);}
  .menu-links{display:flex;gap:8px;align-items:center}
  .menu-links .ml-item{color:var(--grey-dark);font-weight:500;padding:6px 16px;border-radius:500px;font-size: 14px; cursor: pointer;}
  .menu-links .ml-item:hover{background-color:var(--brand);color:#fff;}
  .avatar{width:36px;height:36px;border-radius:50%;background-color:#e0e0e0;}

  .header{padding-top:56px; background: linear-gradient(180deg, var(--brand) 0%, var(--brand) 65%, #fff 100%); padding-bottom: 60px;}
  .searchbox-wrapper{max-width:1000px;margin:20px auto 0;position:relative;padding-inline:16px;}
  .searchbox-card{background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow: 0 8px 24px rgba(0,0,0,0.1);position: relative;}
  .searchbox-field{height:60px;display: flex; flex-direction: column; justify-content: center; padding: 0 16px; border-bottom: 1px solid var(--grey-light);}
  .searchbox-field:last-of-type { border-bottom: none; }
  .searchbox-field label { font-size: 11px; color: var(--grey-med); font-weight: 500; }
  .searchbox-field input { border: none; outline: none; font-size: 15px; font-weight: 600; width: 100%; background: transparent;}
  .searchbox-btn{background: var(--brand); color: #fff; border: none; height: 48px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;}
  
  @media (min-width:768px){
    .searchbox-card{flex-direction:row;border-radius:24px;padding:8px;}
    .searchbox-field{flex:1;height:74px;border-right: 1px solid var(--grey-light);border-bottom:none;}
    .searchbox-btn{height: 58px; width: 120px; margin-top: 0;}
  }

  .autocomplete-dropdown {position: absolute; top: 100%; left: 0; right: 0; background: #fff;border: 1px solid var(--grey-light); border-radius: 12px; z-index: 100; max-height: 250px;overflow-y: auto; display: none;}
  .autocomplete-dropdown li { padding: 12px 16px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  .autocomplete-dropdown li:hover { background-color: #fff7fa; color: var(--brand); }

  #resultados-viagem {display: none; margin-top: 40px; padding: 16px; background: #fff;border-radius: 16px; border: 1px solid var(--grey-light);}
  .trip-card { border: 1px solid var(--grey-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
  .trip-info h4 { margin: 0 0 4px; font-size: 16px; }
  .trip-info p { margin: 0; font-size: 14px; color: var(--grey-med); }
  .trip-price { font-size: 22px; font-weight: 700; color: var(--brand); display: flex; justify-content: space-between; align-items: center;}
  .btn-comprar { background: var(--brand); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;}
  
  .modal-overlay {display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding: 16px;}
  .modal-box {background:#fff; padding:24px; border-radius:16px; width:100%; max-height:90vh; overflow-y:auto;}
  
  .passageiro-box { background: #fafafa; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #eee; }
  .passageiro-box input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Poppins'; font-size: 14px; }
  .passageiro-box label { font-size: 12px; font-weight: 600; color: #666; display: block; }
</style>
</head>
<body>

<nav class="taskbar">
  <div class="container taskbar-desktop">
    <a href="/" title="Buser"><svg class="logo" viewBox="0 0 122 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.6299 11.9915C14.6646 10.4937 13.7047 9.0067 12.7394 7.51022C12.765 7.48173 12.7892 7.45324 12.8162 7.42746C13.4153 6.84813 14.0817 6.36242 14.8127 5.9649C15.6353 5.51717 16.505 5.19834 17.4204 5.00975C17.9482 4.90121 18.4813 4.83745 19.0198 4.82523C21.3529 4.77368 23.4423 5.46833 25.2571 6.94717C26.8901 8.27678 27.9537 9.98627 28.4814 12.0336C28.6039 12.5071 28.6807 12.9887 28.7265 13.4772C28.7776 14.0253 28.7843 14.5734 28.7386 15.1202C28.5757 17.0549 27.9106 18.7956 26.7084 20.3165C25.4281 21.9351 23.7883 23.0177 21.8133 23.5808C21.3219 23.7205 20.8225 23.8128 20.3149 23.8671C19.7683 23.9268 19.2218 23.9417 18.6738 23.9023C17.1189 23.7897 15.6703 23.3312 14.3415 22.5063C13.1164 21.7465 12.1228 20.7479 11.3393 19.5323C9.38451 16.4959 7.42703 13.4609 5.47089 10.4245C4.11519 8.32698 2.76219 6.22539 1.40649 4.12516C1.1655 3.75205 1.00934 3.3491 0.974333 2.90409C0.921828 2.22572 1.0955 1.60976 1.50746 1.06707C1.91269 0.533871 2.44985 0.20554 3.10683 0.122779C4.19193 -0.0128944 5.0697 0.372419 5.67687 1.29364C6.4806 2.50793 7.25471 3.73849 8.04228 4.95955C9.92706 7.88332 11.8145 10.8071 13.7007 13.7295C14.3509 14.7376 15.0012 15.7443 15.6555 16.7496C16.3259 17.7821 17.2602 18.4469 18.4598 18.6857C19.9393 18.9801 21.2425 18.5853 22.3411 17.5447C23.0209 16.9002 23.4369 16.0984 23.6052 15.1744C24.0293 12.8517 22.5969 10.6646 20.3863 10.1043C19.9016 9.98084 19.4089 9.932 18.9121 9.98627C17.5524 10.1355 16.4753 10.7745 15.6918 11.9088C15.6797 11.9264 15.6689 11.944 15.6568 11.9603C15.6514 11.9671 15.6474 11.9712 15.6299 11.9915Z" fill="currentColor"></path></svg></a>
    <div class="menu-links">
      <a href="/" class="ml-item">Início</a><a href="#" class="ml-item">Promoções</a><a href="#" class="ml-item">Viagens</a><a href="#" class="ml-item">Ajuda</a>
      <div class="avatar"></div>
    </div>
  </div>
</nav>

<header class="header">
  <div class="container searchbox-wrapper">
    <div class="searchbox-card">
      <div class="searchbox-field">
        <label>Origem</label>
        <input type="text" id="input-origem" placeholder="Cidade de origem" autocomplete="off">
        <ul id="lista-origem" class="autocomplete-dropdown"></ul>
      </div>
      <div class="searchbox-field">
        <label>Destino</label>
        <input type="text" id="input-destino" placeholder="Cidade de destino" autocomplete="off">
        <ul id="lista-destino" class="autocomplete-dropdown"></ul>
      </div>
      <div class="searchbox-field">
        <label>Data de ida</label>
        <input type="text" id="input-ida" placeholder="Selecione a data" readonly>
      </div>
      <button class="searchbox-btn" id="btn-pesquisar">🔍 Buscar</button>
    </div>
  </div>
</header>

<div class="container" id="resultados-viagem">
  <h2 id="titulo-resultados" style="color:var(--brand); font-size:18px;">Resultados</h2>
  <div id="lista-viagens"></div>
</div>

<!-- MODAL PASSAGEIROS -->
<div id="modal-passageiros" class="modal-overlay">
  <div class="modal-box" style="max-width:600px;">
    <h2 style="color:var(--brand); margin-top:0;">Dados do passageiro</h2>
    <div id="lista-passageiros"></div>
    <button onclick="adicionarPassageiro()" style="width:100%; padding:12px; border:1px dashed var(--brand); background:transparent; color:var(--brand); border-radius:8px; font-weight:600; margin-bottom:16px;">+ Adicionar outro</button>
    <p style="font-size:16px; font-weight:600;">Total: <span id="valor-total" style="color:var(--brand);">R$ 0,00</span></p>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button onclick="fecharModalPassageiros()" style="flex:1; padding:12px; border:1px solid #ddd; background:#fff; border-radius:8px;">Cancelar</button>
      <button onclick="confirmarPassageiros()" style="flex:1; padding:12px; border:none; background:var(--brand); color:#fff; border-radius:8px; font-weight:700;">Continuar</button>
    </div>
  </div>
</div>

<!-- MODAL CHECKOUT -->
<div id="modal-checkout" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <h2 style="color:var(--brand); margin-top:0;">Finalizar Reserva</h2>
    <div id="checkout-info" style="margin:16px 0; font-size:14px; line-height:1.6;"></div>
    <button onclick="gerarPix()" id="btn-gerar-pix" style="width:100%; padding:14px; background:var(--brand); color:#fff; border:none; border-radius:8px; font-weight:700;">Gerar PIX</button>
    <div id="pix-resultado" style="display:none; margin-top:16px; text-align:center;">
      <img id="pix-qrcode" src="" style="max-width:200px; margin:0 auto 8px;">
      <textarea id="pix-copia-cola" readonly style="width:100%; height:60px; padding:8px; border:1px solid #ddd; border-radius:8px; font-size:12px;"></textarea>
      <button onclick="copiarPix()" style="width:100%; padding:10px; background:#40b552; color:#fff; border:none; border-radius:8px; font-weight:700; margin-top:8px;">Copiar Código PIX</button>
    </div>
    <button onclick="fecharCheckout()" style="width:100%; margin-top:12px; padding:12px; background:transparent; border:1px solid #ddd; border-radius:8px;">Cancelar</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCMoq8MNOUjlhqWhjaJ24uW4grhsFFhA", authDomain: "buser202872a.firebaseapp.com",
    projectId: "buser202872a", storageBucket: "buser202872a.appspot.com",
    messagingSenderId: "560317126646", appId: "1:560317126646:web:be9cad9c9ed350940399d7"
  };
  firebase.initializeApp(firebaseConfig);
  const fs = firebase.firestore();
  window.CONFIG = { descontoGlobal: 0, chavePix: "" };
  fs.collection("config").doc("global").onSnapshot(snap => {
    if (snap.exists) window.CONFIG = { ...window.CONFIG, ...snap.data() };
  });
</script>

<!-- CALENDÁRIO -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
<script>
  flatpickr("#input-ida", { locale: "pt", dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", minDate: "today" });

  const cidadesFallback = ["São Paulo, SP", "Rio de Janeiro, RJ", "Belo Horizonte, MG", "Campinas, SP", "Presidente Prudente, SP", "Praia Grande, SP", "Santos, SP", "Curitiba, PR", "Porto Alegre, RS"];
  let cidadesBrasil = [...cidadesFallback];

  async function carregarCidades() {
    try {
      const response = await fetch('./municipios.json');
      const dados = await response.json();
      const listaIBGE = dados.map(c => `${c.nome}, ${c.microrregiao.mesorregiao.UF.sigla}`).sort();
      cidadesBrasil = [...new Set([...listaIBGE, ...cidadesFallback])].sort();
    } catch (e) { }
  }
  carregarCidades();

  function normalizarTexto(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

  function configurarAutocomplete(inputId, listaId) {
    const input = document.getElementById(inputId);
    const lista = document.getElementById(listaId);
    input.addEventListener('focus', function() {
      lista.innerHTML = '';
      cidadesBrasil.slice(0, 20).forEach(cidade => {
        const li = document.createElement('li');
        li.textContent = cidade;
        li.onmousedown = function(e) { e.preventDefault(); input.value = cidade; lista.style.display = 'none'; if(inputId === 'input-origem') document.getElementById('input-destino').focus(); };
        lista.appendChild(li);
      });
      lista.style.display = 'block';
    });
    input.addEventListener('input', function() {
      const termo = normalizarTexto(this.value);
      lista.innerHTML = '';
      if (termo.length < 1) { lista.style.display = 'none'; return; }
      const filtradas = cidadesBrasil.filter(c => normalizarTexto(c).includes(termo)).slice(0, 15);
      if (filtradas.length > 0) {
        filtradas.forEach(cidade => {
          const li = document.createElement('li');
          li.textContent = cidade;
          li.onmousedown = function(e) { e.preventDefault(); input.value = cidade; lista.style.display = 'none'; if(inputId === 'input-origem') document.getElementById('input-destino').focus(); };
          lista.appendChild(li);
        });
        lista.style.display = 'block';
      } else { lista.style.display = 'none'; }
    });
    document.addEventListener('click', e => { if (e.target !== input && e.target !== lista) lista.style.display = 'none'; });
  }
  configurarAutocomplete('input-origem', 'lista-origem');
  configurarAutocomplete('input-destino', 'lista-destino');

  function mascaraCPF(v) { v = v.replace(/\D/g, ''); if (v.length > 11) v = v.slice(0, 11); v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); return v; }
  function mascaraData(v) { v = v.replace(/\D/g, ''); if (v.length > 8) v = v.slice(0, 8); v = v.replace(/(\d{2})(\d)/, '$1/$2').replace(/(\d{2})(\d)/, '$1/$2'); return v; }
  function mascaraTelefone(v) { v = v.replace(/\D/g, ''); if (v.length > 11) v = v.slice(0, 11); v = v.replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d)(\d{4})$/, '$1-$2'); return v; }

  document.getElementById('btn-pesquisar').addEventListener('click', async function() {
    const origemTexto = document.getElementById('input-origem').value;
    const destinoTexto = document.getElementById('input-destino').value;
    const dataIda = document.getElementById('input-ida').value;

    if (!origemTexto.includes(',')) { alert("Selecione a origem na lista."); return; }
    if (!destinoTexto.includes(',')) { alert("Selecione o destino na lista."); return; }
    if (!dataIda) { alert("Escolha a data."); return; }

    const containerResultados = document.getElementById('resultados-viagem');
    const tituloResultados = document.getElementById('titulo-resultados');
    const listaViagens = document.getElementById('lista-viagens');

    const dataFormatada = dataIda.split('-').reverse().join('/');
    containerResultados.style.display = 'block';
    tituloResultados.innerHTML = `Resultados de ${origemTexto} para ${destinoTexto} em ${dataFormatada}`;
    listaViagens.innerHTML = '<p>Buscando viagens...</p>';
    containerResultados.scrollIntoView({ behavior: 'smooth', block: 'center' });

    try {
      // CHAMA O RENDER
      const response = await fetch(`https://buser-online.onrender.com/api/clickbus/search?origem=${encodeURIComponent(origemTexto)}&destino=${encodeURIComponent(destinoTexto)}&data=${dataIda}`);
      const viagens = await response.json();

      if (!viagens || viagens.length === 0) {
        listaViagens.innerHTML = `<div style="text-align: center; padding: 40px 20px; background:#fff; border-radius:16px; border:1px solid #e0e0e0;"><h3 style="color: #454545;">Nenhuma viagem encontrada</h3><p style="color: #757575;">Não achamos ônibus para essa rota nessa data. Tente mudar o dia.</p></div>`;
        return;
      }

      viagensOriginais = viagens;
      renderizarViagens(viagens);
    } catch (error) {
      console.error(error);
      listaViagens.innerHTML = `<p style="color:red;">Erro na busca. Tente novamente.</p>`;
    }
  });

  let viagensOriginais = [];
  function renderizarViagens(viagens) {
    const listaViagens = document.getElementById('lista-viagens');
    listaViagens.innerHTML = viagens.map(viagem => {
      const precoOriginal = viagem.price;
      const desconto = window.CONFIG.descontoGlobal || 0;
      const precoFinal = precoOriginal * (1 - desconto / 100);
      return `
      <div class="trip-card">
        <div class="trip-info">
          <h4>${viagem.company.name} <span style="font-size:10px; color:#fff; background:var(--brand); padding:2px 6px; border-radius:4px;">${viagem.bus_type}</span></h4>
          <p>Saída: <strong>${viagem.departure.time}</strong> (${viagem.departure.terminal}) | Chegada: <strong>${viagem.arrival.time}</strong> (${viagem.arrival.terminal})</p>
        </div>
        <div class="trip-price">
          ${desconto > 0 ? `<div style="text-decoration:line-through;color:#999;font-size:12px;">R$ ${precoOriginal.toFixed(2).replace('.', ',')}</div>` : ''}
          R$ ${precoFinal.toFixed(2).replace('.', ',')}
          <button class="btn-comprar" onclick='abrirModalPassageiros(${JSON.stringify({...viagem, price: precoFinal}).replace(/'/g, "&#39;")})'>Selecionar</button>
        </div>
      </div>
      `;
    }).join('');
  }

  let viagemSelecionada = null, passageiros = [], precoUnitario = 0;

  function abrirModalPassageiros(viagem) {
    viagemSelecionada = viagem; passageiros = []; precoUnitario = viagem.price;
    document.getElementById('lista-passageiros').innerHTML = '';
    adicionarPassageiro();
    document.getElementById('modal-passageiros').style.display = 'flex';
  }

  function adicionarPassageiro() {
    const container = document.getElementById('lista-passageiros');
    const index = passageiros.length;
    passageiros.push({ nome: '', dataNasc: '', cpf: '', telefone: '' });
    const div = document.createElement('div');
    div.className = 'passageiro-box';
    div.innerHTML = `
      <p style="font-weight:600; color:var(--brand);">Passageiro ${index + 1}</p>
      <label>Nome completo</label><input type="text" oninput="passageiros[${index}].nome = this.value">
      <label>Data de nascimento</label><input type="text" placeholder="DD/MM/AAAA" maxlength="10" oninput="this.value = mascaraData(this.value); passageiros[${index}].dataNasc = this.value">
      <label>CPF</label><input type="text" placeholder="000.000.000-00" maxlength="14" oninput="this.value = mascaraCPF(this.value); passageiros[${index}].cpf = this.value">
      <label>Telefone</label><input type="text" placeholder="(99) 99999-9999" maxlength="15" oninput="this.value = mascaraTelefone(this.value); passageiros[${index}].telefone = this.value">
    `;
    container.appendChild(div);
    document.getElementById('valor-total').textContent = `R$ ${(precoUnitario * passageiros.length).toFixed(2).replace('.', ',')}`;
  }

  function fecharModalPassageiros() { document.getElementById('modal-passageiros').style.display = 'none'; }
  function confirmarPassageiros() {
    for (let i = 0; i < passageiros.length; i++) {
      if (!passageiros[i].nome || !passageiros[i].cpf || !passageiros[i].dataNasc) { alert(`Preencha os dados do passageiro ${i + 1}.`); return; }
    }
    fecharModalPassageiros();
    abrirCheckout(viagemSelecionada, passageiros);
  }

  function abrirCheckout(viagem, listaPassageiros) {
    const totalFinal = (viagem.price || 0) * listaPassageiros.length;
    let passageirosHTML = listaPassageiros.map(p => `<li>${p.nome} (CPF: ${p.cpf})</li>`).join('');
    document.getElementById('checkout-info').innerHTML = `
      <strong>Empresa:</strong> ${viagem.company.name} <br>
      <strong>Saída:</strong> ${viagem.departure.time} <br>
      <strong>Total:</strong> <span style="color:var(--brand); font-size:18px;">R$ ${totalFinal.toFixed(2).replace('.', ',')}</span>
      <br><br><strong>Passageiros:</strong> <ul>${passageirosHTML}</ul>
    `;
    document.getElementById('modal-checkout').style.display = 'flex';
  }
  function fecharCheckout() { document.getElementById('modal-checkout').style.display = 'none'; }

  async function gerarPix() {
    const chavePix = window.CONFIG.chavePix;
    const total = (viagemSelecionada.price || 0) * passageiros.length;
    if (!chavePix) { alert("Chave PIX não configurada no painel."); return; }
    
    document.getElementById('pix-copia-cola').value = chavePix;
    document.getElementById('pix-qrcode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(chavePix)}`;
    document.getElementById('pix-resultado').style.display = 'block';
    document.getElementById('checkout-info').innerHTML += `<br><br><strong style="color:red;">Pague R$ ${total.toFixed(2).replace('.', ',')} na chave PIX acima.</strong>`;
    document.getElementById('btn-gerar-pix').style.display = 'none';

    // Salva o histórico no Firebase
    fs.collection("pix_gerados").add({
      cliente: passageiros[0].nome, valor: total, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(console.warn);
  }

  function copiarPix() {
    const codigo = document.getElementById('pix-copia-cola').value;
    navigator.clipboard.writeText(codigo).then(() => { alert('PIX copiado!'); });
  }
</script>
</body>
</html>
