<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Buser</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; background: #f4f5f7; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-box, .painel-box { background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; display: none; }
  h2 { color: #f11075; margin-top: 0; text-align: center; }
  label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 4px; margin-top: 16px;}
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins'; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #f11075; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Poppins'; font-size: 16px; margin-top: 24px;}
  button:hover { background: #e70869; }
  .msg { text-align: center; font-size: 14px; margin-top: 12px; color: #40b552; display: none; }
  .msg-erro { color: #d81b60; }
</style>
</head>
<body>

<!-- Tela de Login -->
<div class="login-box" id="loginBox" style="display: block;">
  <h2>Acesso Restrito</h2>
  <input type="password" id="senhaAdmin" placeholder="Digite a senha de admin">
  <button onclick="fazerLogin()">Entrar</button>
</div>

<!-- Painel de Controle -->
<div class="painel-box" id="painelBox">
  <h2>Configurações</h2>
  
  <label>Desconto Global (%)</label>
  <input type="number" id="inputDesconto" placeholder="Ex: 10" min="0" max="100">
  
  <label>Chave Secreta BlackCat (API Key)</label>
  <input type="password" id="inputBlackcatKey" placeholder="Cole sua chave aqui">
  
  <button onclick="salvarConfig()" id="btn-salvar">Salvar Configurações</button>
  <p class="msg" id="msgStatus"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  // Configuração do SEU projeto Firebase novo
  const firebaseConfig = {
    apiKey: "AIzaSyCMoq8MNOUjlhqWhjaJ24uW4grhsFFhA",
    authDomain: "buser202872a.firebaseapp.com",
    projectId: "buser202872a",
    storageBucket: "buser202872a.appspot.com",
    messagingSenderId: "560317126646",
    appId: "1:560317126646:web:be9cad9c9ed350940399d7"
  };
  
  firebase.initializeApp(firebaseConfig);
  const fs = firebase.firestore();
  const SENHA_MESTRA = "buser2026";

  function fazerLogin() {
    const senha = document.getElementById('senhaAdmin').value;
    if (senha === SENHA_MESTRA) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('painelBox').style.display = 'block';
      carregarDados();
    } else {
      alert("Senha incorreta!");
    }
  }

  async function carregarDados() {
    try {
      const doc = await fs.collection("config").doc("global").get();
      if (doc.exists) {
        document.getElementById('inputDesconto').value = doc.data().descontoGlobal || 0;
        document.getElementById('inputBlackcatKey').value = doc.data().blackcatKey || '';
      }
    } catch (e) {
      console.log("Sem dados ainda, mas pode digitar.");
    }
  }

  async function salvarConfig() {
    const btn = document.getElementById('btn-salvar');
    const msg = document.getElementById('msgStatus');
    
    btn.textContent = "Salvando...";
    msg.style.display = 'none';

    const desconto = parseFloat(document.getElementById('inputDesconto').value) || 0;
    const blackcatKey = document.getElementById('inputBlackcatKey').value;
    
    try {
      await fs.collection("config").doc("global").set({
        descontoGlobal: desconto,
        blackcatKey: blackcatKey
      }, { merge: true });
      
      msg.textContent = "Salvo com sucesso!";
      msg.className = "msg";
      msg.style.display = 'block';
    } catch (error) {
      msg.textContent = "Erro ao salvar. Verifique o console.";
      msg.className = "msg msg-erro";
      msg.style.display = 'block';
      console.error("Erro ao salvar:", error);
    } finally {
      btn.textContent = "Salvar Configurações";
      setTimeout(() => msg.style.display = 'none', 4000);
    }
  }
</script>
</body>
</html>
